name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: iitd-merch-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run DB migrations (optional - requires DATABASE_URL secret)
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL || 'true' }}
        run: npm run db:migrate

      - name: Log in to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-to-azure:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container to Azure Web App
        env:
          IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          az webapp config container set \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --docker-custom-image-name "$IMAGE" \
            --docker-registry-server-url "https://${{ secrets.ACR_REGISTRY }}" \
            --docker-registry-server-user "${{ secrets.ACR_USERNAME }}" \
            --docker-registry-server-password "${{ secrets.ACR_PASSWORD }}"

# Required repo secrets:
# - ACR_REGISTRY (e.g. myregistry.azurecr.io)
# - ACR_USERNAME, ACR_PASSWORD
# - AZURE_CREDENTIALS (service principal JSON for azure/login)
# - AZURE_WEBAPP_NAME, AZURE_RESOURCE_GROUP
# Optional:
# - DATABASE_URL (if you want migrations to run in CI)

# Notes:
# - This workflow builds a Docker image and pushes it to Azure Container Registry, then updates an Azure Web App for Containers to use the new image.
# - Ensure the Azure service principal has permissions to modify the target Web App and that the ACR credentials are valid.
# - For private networks, consider running migrations as part of a deployment job inside Azure where the runner has DB network access.
